:root{--g:#0AC290;--gd:#07926C;--gl:#CEF3E9;--part:#A8EAD7;--none:#E4E6E8;--ink:#191F28;--sub:#4E5968;--mute:#8B95A1;--line:#E5E8EB;--bg:#F7F8FA;--card:#fff;--red:#E5484D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;word-break:keep-all}
.wrap{max-width:560px;margin:0 auto;background:var(--card);min-height:100vh;padding-bottom:40px}
header.top{padding:18px 20px 0}
header.top img{height:22px;display:block}
.hero{padding:22px 20px 18px}
.hero h1{font-size:26px;font-weight:700;letter-spacing:-.4px}
.hero p{font-size:15px;color:var(--sub);margin-top:6px}
.search{margin:0 20px;padding:18px;border-radius:18px;background:var(--gl)}
.search label{font-size:14px;font-weight:700;color:var(--gd);display:block;margin-bottom:10px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;height:50px;border:1.5px solid transparent;border-radius:12px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:var(--ink);outline:none}
.row input:focus{border-color:var(--g)}
.row button{height:50px;padding:0 18px;border:0;border-radius:12px;background:var(--g);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.row button:active{background:var(--gd)}
.hint{font-size:13px;color:var(--sub);margin-top:10px}
.hint a{color:var(--gd);font-weight:700}
#res{margin:14px 20px 0}
.sug{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sug[hidden]{display:none}
.sug button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:#fff;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.sug button:last-child{border-bottom:0}
.sug button:active{background:var(--bg)}
.sug .tx{flex:1;min-width:0}
.sug em{font-style:normal;color:var(--g);font-weight:600}
.sug .bd{font-size:12px;padding:3px 8px}
.r{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;background:#fff}
.r .t{flex:1;min-width:0}
.r .a{font-size:13px;color:var(--mute)}
.r .d{font-size:16px;font-weight:700}
.r .m{font-size:13px;color:var(--sub);margin-top:2px}
.bd{flex:none;font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px}
.bd.o{background:var(--g);color:#fff}.bd.p{background:var(--gl);color:var(--gd)}.bd.x{background:var(--none);color:var(--sub)}
.big{border-radius:16px;padding:18px;text-align:left}
.big.o{background:#E9FAF4;border:1.5px solid var(--g)}.big.x{background:#F2F4F6}.big.p{background:#F4FBF8;border:1.5px dashed var(--g)}
.big b{display:block;font-size:18px;margin-bottom:4px}
.big span{font-size:14px;color:var(--sub)}
.sg{display:block;width:100%;margin-top:12px;height:48px;border:1.5px solid var(--g);border-radius:12px;padding:0 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.more{font-size:13px;color:var(--mute);margin:4px 2px 0}
.sec{padding:30px 20px 0}
.sec h2{font-size:19px;font-weight:700;margin-bottom:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-size:15px;font-weight:600;background:#F2F4F6;color:var(--sub);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
.mapbox{position:relative;margin-top:14px;border-radius:16px;background:#FBFCFC;border:1px solid var(--line);padding:8px}
.mapbox svg{width:100%;height:auto;display:block}
.mapbox path{stroke:#fff;stroke-width:1.2;stroke-linejoin:round;transition:fill .2s}
.mapbox path.full{fill:var(--g)}.mapbox path.part{fill:var(--part)}.mapbox path.none{fill:var(--none)}
.mapbox path.hl{stroke:var(--ink);stroke-width:2.6}
.mapbox text{font-size:16px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:rgba(255,255,255,.75);stroke-width:3px;pointer-events:none}
.mapbox text.none{fill:#6B7684}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin:12px 4px 0}
.lg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lists{margin-top:22px}
.grp{margin-bottom:20px}
.grp h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.grp h3 i{width:14px;height:14px;border-radius:50%}
.grp p{font-size:15px;color:var(--sub)}
.grp p b{color:var(--ink);font-weight:700}
details{margin-top:4px;font-size:15px;color:var(--sub);padding:8px 0;border-bottom:1px solid var(--line)}
details summary{cursor:pointer;color:var(--sub);list-style:none}details summary b{color:var(--ink)}
details summary::-webkit-details-marker{display:none}
details summary::after{content:" ▾";color:var(--gd)}
details[open] summary::after{content:" ▴"}
details div{margin-top:6px;padding:12px 14px;background:var(--bg);border-radius:12px;line-height:1.7}
.note{margin:26px 20px 0;padding:16px;border-radius:14px;background:#F2F4F6;font-size:13px;color:var(--sub);line-height:1.7}
.note b{color:var(--ink)}
.foot{font-size:12px;color:var(--mute);padding:16px 20px 0;text-align:center}
</style>

  let no=null;
  if(m)no=+m[2];
  else{m=q.match(/(\S+(?:로|길))$/);if(!m||/(동|가|읍|면)$/.test(q))return null;}
  const road=m[1],before=q.slice(0,m.index).trim();
  const words=before.split(' ').filter(Boolean).map(strip);
  const sidoIn=words.map(w=>SIDO_ALIAS[w.replace(/시$|도$/,'')]||SIDO_ALIAS[w]).find(Boolean);
  const emd=words.find(w=>/(읍|면)$/.test(w));
  const OTHER=['울산','광주','강원','충북','충남','전북','전남','제주','강원도','강원특별자치도','충청북도','충청남도','전라북도','전북특별자치도','전라남도','제주도','제주특별자치도','울산시','광주시'];
  if(words.length&&OTHER.includes(words[0])&&!(words[0]==='광주시'&&false))return{road,no,res:[{label:q,st:'x',why:'area'}]};
  const eq=(w,x)=>w===x||w===x.replace(/(시|군|구|읍|면)$/,'');
  const inSido=pre=>!sidoIn||pre.startsWith(sidoIn+' ')||pre===sidoIn;
  const keys=Object.keys(RD.SG).filter(inSido);
  let cands=keys.filter(pre=>{const t=pre.split(' ');return t.length>1&&words.some(w=>eq(w,t[t.length-1]))});
  if(!cands.length)cands=keys.filter(pre=>{const t=pre.split(' ');return t.length>2&&words.some(w=>eq(w,t[1]))});
  if(!cands.length&&sidoIn==='세종특별자치시')cands=keys.filter(p=>p==='세종특별자치시'||p.startsWith('세종특별자치시 '));
  if(cands.length>1){const withRoad=cands.filter(p=>RD.R[p]&&RD.R[p][road]!==undefined);if(withRoad.length)cands=withRoad;}
  // 읍·면을 입력했는데 그 읍·면이 목록에 없으면 → 불가
  let regionWord=words.find(w=>/(시|군|구)$/.test(w));
  if(emd){const c2=cands.filter(p=>p.endsWith(' '+emd));if(c2.length)cands=c2;else if(cands.length||regionWord)return{road,no,res:[{label:before+' '+road+(no===null?'':' '+no),st:'x',why:'emd'}]}}
  else cands=cands.filter(p=>!/(읍|면)$/.test(p));
  // 시·구를 안 적은 경우: 도로 이름으로 후보 찾기
  if(!cands.length){
    if(regionWord&&words.length){return{road,no,res:[{label:q,st:'x',why:'area'}]}}
    const set=new Set(SIDX[stemOf(road)]||[]);
    Object.keys(RD.R).forEach(p=>{if(RD.R[p][road]!==undefined)set.add(p)});
    cands=[...set].filter(p=>(!sidoIn||p.startsWith(sidoIn))&&(emd?p.endsWith(' '+emd):true));
    if(!cands.length)return{road,no,res:[],ask:true};
  }
  // 같은 지역 옛 이름·새 이름(예: 인천 서구/서해구) 중복은 결과가 같으면 하나로
  const res=[];
  cands.forEach(pre=>{
    let st;
    if(RD.SG[pre]===undefined)st='x';
    else if(RD.SG[pre]==='o')st='o';
    else{const v=(RD.R[pre]||{})[road];st=v===undefined?'u':(Array.isArray(v)?bldg(v,no):v)}
    res.push({label:pre+' '+road+(no===null?'':' '+no),st,pre});
  });
  return{road,no,res};
}

const REG=[
 {k:'metro',n:'수도권',

  part:[['대구시 달성군',['달성군']],['경산시',['경산시']]],none:[]},
 {k:'dj',n:'대전·세종',
  full:[['대전시','대덕구, 동구, 서구, 유성구, 중구']],
  part:[['세종시 (행정중심복합도시 동 지역)',['세종시']]],
  none:[['세종시','조치원읍과 면 지역(금남·부강·소정·연기·연동·연서·장군·전동·전의면)']],note:'세종시는 행정중심복합도시(동 지역)만 가능해요.'}
];
const ST={o:'가능',p:'일부 가능',x:'불가'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur='metro',hl=null;

function tabs(){
  $('#tabs').innerHTML=REG.map(r=>`<button role="tab" data-k="${r.k}" aria-selected="${r.k===cur}">${r.n}</button>`).join('');
  $('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){hl=null;show(b.dataset.k)}};
}
function dongsOf(r,gs){
  const set=ROWS.filter(x=>x[3]===r&&gs.includes(x[4])&&x[2]!=='x');
  const seen=new Set(),out=[];
  set.sort((a,b)=>a[1].localeCompare(b[1],'ko')).forEach(x=>{const k=x[1];if(seen.has(k))return;seen.add(k);out.push(x[2]==='p'?k+'(일부)':k)});
  return out;
}
function show(k){
  cur=k;const m=MAP[k],r=REG.find(x=>x.k===k);
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));
  const svg=$('#map');svg.setAttribute('viewBox',`0 0 ${m.w} ${m.h}`);svg.setAttribute('aria-label',r.n+' 서비스 지역 지도');
  svg.innerHTML=m.f.map(f=>`<path class="${f.s}${hl===f.n?' hl':''}" d="${f.d}"><title>${esc(f.n)}</title></path>`).join('')
   +m.f.map(f=>`<text class="${f.s}" x="${f.x}" y="${f.y}">${esc(f.n)}</text>`).join('');
  const used=new Set(m.f.map(f=>f.s));
  $('#lg').innerHTML=[['full','전 지역 가능','var(--g)'],['part','일부 지역 가능','var(--part)'],['none','제외 지역','var(--none)']]
   .filter(x=>used.has(x[0])).map(x=>`<span><i style="background:${x[2]}"></i>${x[1]}</span>`).join('');
  const line=a=>a.map(([h,t])=>`<p>${h?`<b>${h}</b> `:''}${h?'('+t+')':t}</p>`).join('');
  let html='';
  if(r.full.length)html+=`<div class="grp"><h3><i style="background:var(--g)"></i>전 지역 가능</h3>${line(r.full)}</div>`;
  if(r.part.length)html+=`<div class="grp"><h3><i style="background:var(--part)"></i>일부 지역 가능</h3>`+r.part.map(([h,gs])=>{
     const d=dongsOf(k,gs);return d.length?`<details><summary><b>${h}</b> · 가능한 동 ${d.length}곳</summary><div>${d.join(', ')}</div></details>`:`<p><b>${h}</b></p>`;}).join('')+`</div>`;
  if(r.none.length)html+=`<div class="grp"><h3><i style="background:#C9CED4"></i>제외 지역</h3>${line(r.none)}</div>`;
  if(r.note)html+=`<p class="more">${r.note}</p>`;
  $('#lists').innerHTML=html;
}
function inZip(z){const n=+z;let lo=0,hi=RANGES.length-1;while(lo<=hi){const m=(lo+hi)>>1,[a,b]=RANGES[m];if(n<a)hi=m-1;else if(n>b)lo=m+1;else return true}return false}
const norm=s=>s.replace(/특별자치시|특별시|광역시|특별자치도|도(?=\s)/g,'').replace(/\s+/g,' ').trim();
function find(q){
  const toks=norm(q).split(' ').filter(Boolean);
  const hit=ts=>ROWS.filter(x=>{const full=(x[0]+' '+x[1]).replace(/·/g,' ');return ts.every(t=>full.includes(t)||full.includes(t.replace(/시$|구$|군$/,'')))});
  let r=hit(toks);
  if(!r.length){const t2=toks.map(t=>t.replace(/제?\d+(동)$/,'$1'));r=hit(t2);}
  // 동 이름을 정확히 친 경우 그 동을 앞으로
  const last=toks[toks.length-1];
  r.sort((a,b)=>(b[1]===last)-(a[1]===last));
  return r;
}
function go(e){
  e&&e.preventDefault();
  const q=$('#q').value.trim();const box=$('#res');
  if(!q){box.innerHTML='';return}
  const z=q.replace(/[^0-9]/g,'');
  if(/^\d{5}$/.test(z)&&z.length===q.replace(/\s|-/g,'').length){
    const ok=inZip(z);
    box.innerHTML=`<div class="big ${ok?'o':'x'}"><b>${ok?'이용 가능한 지역이에요':'아직 서비스하지 않는 지역이에요'}</b><span>우편번호 ${z} 기준${ok?' · 런드리고 앱에서 주소를 등록하고 바로 신청해 보세요.':' · 서비스 지역은 계속 넓혀가고 있어요.'}</span></div>`;
    return;
  }
  const rr=roadSearch(q);
  if(rr){
    if(!rr.res.length){
      box.innerHTML=`<div class="big x"><b>이 도로명을 찾지 못했어요</b><span>도로명을 다시 확인해 주세요. 런드리고 서비스 지역에 없는 도로일 수 있어요. 시·구를 함께 입력하거나 우편번호로 확인해 보세요.</span></div>`;
      return;
    }
    const MSG={o:'이용 가능한 주소예요',x:'아직 서비스하지 않는 주소예요',u:'이 주소는 정확히 확인하기 어려워요',p:''};
    const SUB={o:'런드리고 앱에서 주소를 등록하고 바로 신청해 보세요.',x:'서비스 지역은 계속 넓혀가고 있어요.',u:'우편번호로 한 번 더 확인해 주세요.'};
    const gk=x=>{const g=x.pre&&preGroup(x.pre);return (g?g.join():x.pre||x.label)+'|'+x.st};
    const uniq=[];rr.res.forEach(x=>{if(!uniq.some(y=>gk(y)===gk(x)))uniq.push(x)});
    const RANK={o:0,u:1,x:2};uniq.sort((a,b)=>RANK[a.st]-RANK[b.st]||a.label.localeCompare(b.label,'ko'));
    if(uniq.length===1){
      const x=uniq[0];
      box.innerHTML=`<div class="big ${x.st==='u'?'p':x.st}"><b>${MSG[x.st]}</b><span>${esc(x.label.replace(/^(\S+)/,(s)=>s))}<br>${SUB[x.st]}</span></div>`;
      const g=x.pre&&preGroup(x.pre);if(g){hl=g[1];show(g[0])}
      return;
    }
    const L=uniq.slice(0,12);
    box.innerHTML=`<p class="more" style="margin:0 2px 8px">「${esc(rr.road)}」가 있는 지역이 ${uniq.length}곳이에요${uniq.length>12?' (12곳만 표시)':''}. 우리 집 지역을 확인해 주세요.</p>`+
     L.map((x,i)=>`<div class="r" data-i="${i}"><div class="t"><div class="a">${esc(x.pre||'')}</div><div class="d">${esc(rr.road+(rr.no===null?'':' '+rr.no))}</div>${x.st==='u'?'<div class="m">우편번호로 한 번 더 확인해 주세요</div>':''}</div><span class="bd ${x.st==='u'?'p':x.st}">${x.st==='u'?'확인 필요':ST[x.st]}</span></div>`).join('');
    box.onclick=ev=>{const d=ev.target.closest('.r');if(!d)return;const g=preGroup(L[+d.dataset.i].pre);if(g){hl=g[1];show(g[0]);$('#tabs').scrollIntoView({behavior:'smooth',block:'start'})}};
    return;
  }
  const r=find(q);
  if(!r.length){
    box.innerHTML=`<div class="big x"><b>검색된 서비스 지역이 없어요</b><span>동 이름을 다시 확인하거나 5자리 우편번호로 검색해 주세요. 목록에 없는 지역은 아직 서비스하지 않아요.</span></div>`;return;
  }
  const L=r.slice(0,12);
  box.innerHTML=(r.length===1?'':`<p class="more" style="margin:0 2px 8px">「${esc(q)}」 검색 결과 ${r.length}곳${r.length>12?' 중 12곳':''} · 눌러서 지도에서 보기</p>`)+
   L.map((x,i)=>`<div class="r" data-i="${i}"><div class="t"><div class="a">${esc(x[0].replace('세종 세종시','세종특별자치시'))}</div><div class="d">${esc(x[1])}</div>${x[2]==='p'?'<div class="m">일부 지역만 가능해요 · 우편번호로 확인해 주세요</div>':x[2]==='x'?'<div class="m">아직 서비스하지 않는 동이에요</div>':''}</div><span class="bd ${x[2]}">${ST[x[2]]}</span></div>`).join('');
  box.onclick=ev=>{const d=ev.target.closest('.r');if(!d)return;focusOn(L[+d.dataset.i])};
  if(r.length===1)focusOn(r[0],true);
}
function focusOn(x,quiet){hl=x[4];show(x[3]);if(!quiet)$('#tabs').scrollIntoView({behavior:'smooth',block:'start'})}
$('#go').addEventListener('click',go);
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();go()}});

// ── 주소 자동완성 (앱 주소 검색처럼 도로명 입력 중 후보 노출)
const SUG=[];{const seen=new Set();const add=(pre,road)=>{const k=pre+' '+road;if(seen.has(k))return;seen.add(k);SUG.push([pre,road])};
  for(const p in STEMS)STEMS[p].split(',').forEach(s=>s&&add(p,s));
  for(const p in RD.R)Object.keys(RD.R[p]).forEach(r=>add(p,r));}
const sugStatus=(pre,road)=>{if(RD.SG[pre]===undefined)return'x';if(RD.SG[pre]==='o')return'o';const v=(RD.R[pre]||{})[road];if(v===undefined)return'';if(Array.isArray(v))return'';return v};
function suggest(){
  const box=$('#sug');const q=$('#q').value.replace(/\s+/g,' ').trim();
  if(q.length<2||/\d+\s*$/.test(q)&&/(로|길)\s*\d/.test(q)||/^\d+$/.test(q)){box.hidden=true;return}
  const tk=q.split(' ');const last=tk.pop();const rg=tk.map(strip).filter(Boolean);
  if(last.length<2&&!rg.length){box.hidden=true;return}
  const hits=SUG.filter(([p,r])=>r.startsWith(last)&&rg.every(w=>p.split(' ').some(x=>x===w||x.replace(/(특별시|광역시|특별자치시|도|시|군|구|읍|면)$/,'')===w.replace(/(시|군|구|도)$/,'')||x.startsWith(w))));
  if(!hits.length){box.hidden=true;return}
  const R={o:0,'':1,x:2};
  hits.sort((a,b)=>(a[1]===last?0:1)-(b[1]===last?0:1)||R[sugStatus(...a)]-R[sugStatus(...b)]||a[1].length-b[1].length||(a[0]+a[1]).localeCompare(b[0]+b[1],'ko'));
  const L=hits.slice(0,8);
  box.innerHTML=L.map((h,i)=>{const s=sugStatus(...h);return `<button type="button" data-i="${i}"><span class="tx">${esc(h[0])} <em>${esc(last)}</em>${esc(h[1].slice(last.length))}</span>${s==='o'?'<span class="bd o">가능</span>':s==='x'?'<span class="bd x">불가</span>':''}</button>`}).join('');
  box.hidden=false;
  box.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const h=L[+b.dataset.i];
    $('#q').value=h[0]+' '+h[1]+' ';box.hidden=true;$('#q').focus();
    $('#res').innerHTML=`<p class="more" style="margin:0 2px">건물번호까지 입력하면 더 정확해요. 바로 확인하려면 「확인」을 눌러 주세요.</p>`;};
}
$('#q').addEventListener('input',suggest);
$('#go').addEventListener('click',()=>{$('#sug').hidden=true});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')$('#sug').hidden=true});
tabs();show('metro');
